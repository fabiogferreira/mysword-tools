[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mysword-tools"
version = "1.0.0"
description = "Ferramentas para criar conteúdo compatível com o aplicativo MySword"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MySword Tools"}
]
keywords = ["mysword", "bible", "journal", "word", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Religion",
]

dependencies = [
    "python-docx>=1.1.0",
    "click>=8.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mysword-tools = "src.cli:main"

[project.urls]
Homepage = "https://github.com/mysword-tools/mysword-tools"
Documentation = "https://github.com/mysword-tools/mysword-tools#readme"
Repository = "https://github.com/mysword-tools/mysword-tools"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
